apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rmq
  namespace: enterprise-stack
  labels:
    app: enterprise-rmq
    tier: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-rmq
  template:
    metadata:
      labels:
        app: enterprise-rmq
        tier: messaging
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: RMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: enterprise-secrets
                  key: rmq-password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-rmq
  namespace: enterprise-stack
  labels:
    app: enterprise-rmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
  selector:
    app: enterprise-rmq
---
apiVersion: v1
kind: Service
metadata:
  name: vpromq01
  namespace: enterprise-stack
  labels:
    app: enterprise-rmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
  selector:
    app: enterprise-rmq

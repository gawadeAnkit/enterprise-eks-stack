apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-dashboard
  namespace: enterprise-stack
  labels:
    app: devops-dashboard
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-dashboard
  template:
    metadata:
      labels:
        app: devops-dashboard
        tier: observability
    spec:
      containers:
        - name: dashboard
          image: <DASHBOARD_IMAGE>
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "<VERSION_PLACEHOLDER>"
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: devops-dashboard
  namespace: enterprise-stack
  labels:
    app: devops-dashboard
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: devops-dashboard


apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-db
  namespace: enterprise-stack
  labels:
    app: enterprise-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: enterprise-db
        tier: database
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprise-secrets
                  key: db-password
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: enterprise-config
                  key: DB_NAME
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "400m"
              memory: "768Mi"
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 35
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: db-init
          configMap:
            name: db-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-db
  namespace: enterprise-stack
  labels:
    app: enterprise-db
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: enterprise-db
---
apiVersion: v1
kind: Service
metadata:
  name: vprodb
  namespace: enterprise-stack
  labels:
    app: enterprise-db
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: enterprise-db

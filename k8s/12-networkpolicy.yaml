apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-db-netpol
  namespace: enterprise-stack
  labels:
    app: enterprise-db
    tier: database
spec:
  podSelector:
    matchLabels:
      app: enterprise-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: enterprise-webapp
      ports:
        - protocol: TCP
          port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-cache-netpol
  namespace: enterprise-stack
  labels:
    app: enterprise-cache
    tier: cache
spec:
  podSelector:
    matchLabels:
      app: enterprise-cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-rmq-netpol
  namespace: enterprise-stack
  labels:
    app: enterprise-rmq
    tier: messaging
spec:
  podSelector:
    matchLabels:
      app: enterprise-rmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: enterprise-webapp

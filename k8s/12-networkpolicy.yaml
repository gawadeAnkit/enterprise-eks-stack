apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-webapp-netpol
  namespace: enterprise-stack
  labels:
    app: enterprise-webapp
    tier: application
spec:
  podSelector:
    matchLabels:
      app: enterprise-webapp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: enterprise-proxy
      ports:
        - protocol: TCP
          port: 8080

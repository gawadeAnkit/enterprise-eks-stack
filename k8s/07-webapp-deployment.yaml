apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-webapp
  namespace: enterprise-stack
  labels:
    app: enterprise-webapp
    tier: application
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: enterprise-webapp
  template:
    metadata:
      labels:
        app: enterprise-webapp
        tier: application
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -v -w3 vprodb 3306; do echo "Waiting for MySQL..."; sleep 3; done']
        - name: wait-for-cache
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z -v -w3 vprocache01 11211; do echo "Waiting for Memcached..."; sleep 3; done']
      containers:
        - name: webapp
          image: <WEBAPP_IMAGE>
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: enterprise-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprise-secrets
                  key: db-password
            - name: RMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprise-secrets
                  key: rmq-password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /
              port: 8080
            failureThreshold: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-webapp
  namespace: enterprise-stack
  labels:
    app: enterprise-webapp
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: enterprise-webapp
---
apiVersion: v1
kind: Service
metadata:
  name: vproapp
  namespace: enterprise-stack
  labels:
    app: enterprise-webapp
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: enterprise-webapp
